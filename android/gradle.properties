android.useFullClasspathForDexingTransform=true
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# rive_common (transitive via awesome_dialog) builds native code from source.
# NDK 28+ aligns 64-bit native libraries to 16 KB, as required by Google Play.
rive.ndk.version=28.2.13676358
# rive_common still declares minSdk 19; the app itself targets minSdk 24, so this
# only silences NDK 28's check (NDK 28 supports API 21+).
android.ndk.suppressMinSdkVersionError=21
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
